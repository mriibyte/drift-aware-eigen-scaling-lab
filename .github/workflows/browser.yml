name: browser visualizer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser visualizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
